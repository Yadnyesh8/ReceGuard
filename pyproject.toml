[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raceguard-cli"
dynamic = ["version"]
description = "Find, prove, and repair atomicity violations in Python HTTP handlers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "RaceGuard" }]
keywords = ["race-condition", "concurrency", "static-analysis", "fastapi", "postgresql"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "libcst>=1.4",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "sqlalchemy>=2.0.30",
]

[project.optional-dependencies]
harness = [
  "psycopg[binary]>=3.3.6",
  "asyncpg>=0.29",
  "testcontainers[postgres]>=4.5",
  "docker>=7.1",
]
mcp = ["mcp>=2.1,<3"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "types-PyYAML",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "alembic>=1.13",
  # The reference app in examples/shop runs from this environment in tests.
  "sqlalchemy[asyncio]>=2.0.30",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
raceguard = "raceguard.cli:main"

[project.urls]
Homepage = "https://github.com/Yadnyesh8/ReceGuard"

# One version, one place: the package reads it and the build reads it from
# the package. Two hardcoded copies drift the first time a release is cut.
[tool.hatch.version]
path = "raceguard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["raceguard"]
# PEP 561: without this the marker exists in the repo and not in the wheel,
# so downstream type checkers ignore our annotations entirely.
artifacts = ["raceguard/py.typed"]

# The MCP server serves these as raceguard://docs/{name}, and its own prompts
# send agents there. Without this they exist only in a source checkout, so a
# pip-installed server answered every docs read with an empty list.
[tool.hatch.build.targets.wheel.force-include]
"docs" = "raceguard/_docs"

[tool.hatch.build.targets.sdist]
include = [
  "/raceguard",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/corpus/**" = ["F", "E", "B", "I", "UP"]
"examples/**" = ["B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "docker: requires a working Docker daemon",
  "slow: long running",
]

[tool.coverage.run]
source = ["raceguard"]
branch = true
omit = ["raceguard/action/*"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "except ImportError:",
  "pragma: no cover",
]
skip_covered = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
