[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raceguard"
version = "0.1.0"
description = "Find, prove, and repair atomicity violations in Python HTTP handlers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "RaceGuard" }]
keywords = ["race-condition", "concurrency", "static-analysis", "fastapi", "postgresql"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "libcst>=1.4",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "sqlalchemy>=2.0.30",
]

[project.optional-dependencies]
harness = [
  "psycopg[binary]>=3.1",
  "asyncpg>=0.29",
  "testcontainers[postgres]>=4.5",
  "docker>=7.1",
]
mcp = ["mcp>=1.28,<3"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "types-PyYAML",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "alembic>=1.13",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
raceguard = "raceguard.cli:main"

[project.urls]
Homepage = "https://github.com/raceguard/raceguard"

[tool.hatch.build.targets.wheel]
packages = ["raceguard"]
# PEP 561: without this the marker exists in the repo and not in the wheel,
# so downstream type checkers ignore our annotations entirely.
artifacts = ["raceguard/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
  "/raceguard",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/corpus/**" = ["F", "E", "B", "I", "UP"]
"examples/**" = ["B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "docker: requires a working Docker daemon",
  "slow: long running",
]

[tool.coverage.run]
source = ["raceguard"]
branch = true
omit = ["raceguard/action/*"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "except ImportError:",
  "pragma: no cover",
]
skip_covered = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# The MCP Python SDK renamed FastMCP to MCPServer in v2, and this project
# supports both because `pip install mcp` resolves to 2.x while a consumer not
# ready to migrate pins `mcp>=1.28,<2`. Only one of the two imports can ever
# type check, whichever version happens to be installed. Scoped here rather
# than suppressed inline so it stays visible and can be deleted when v1
# support is dropped.
[[tool.mypy.overrides]]
module = "raceguard.mcp_server"
warn_unused_ignores = false
disable_error_code = ["attr-defined", "no-redef", "assignment"]
