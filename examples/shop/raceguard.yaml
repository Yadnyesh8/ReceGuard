version: 1

app:
  module: "shop.main:app"
  start: "uvicorn shop.main:app --host 0.0.0.0 --port 8000"
  dockerfile: "Dockerfile"
  health_path: "/health"
  base_url: "http://localhost:8000"
  database_url_env: "DATABASE_URL"
  # This app drives an async engine, so the URL it is handed must name the
  # async driver. RaceGuard does not guess this.
  database_url_driver: "asyncpg"
  migrate: "alembic upgrade head"
  test_command: "pytest -q"
  thread_pool_size: 40

database:
  # Pinned by digest, not by tag. A moved tag silently changes what every
  # verification ran against, which quietly invalidates any number this tool
  # produced before the move.
  image: "postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73"

defaults:
  mode: container
  trials: 20
  concurrency: 4
  sync: barrier
  amplify: true
  amplify_ms: 25

targets:
  # oversell / non_negative -- stock=1 with concurrency=2 is the tightest
  # seed that can expose it: two buyers, one unit, at most one should win.
  - id: purchase
    route: "POST /orders"
    handler: "shop/routes/orders.py::create_order"
    spec: "an order must never reduce an item's stock below zero"
    payload: { item_id: 1, qty: 1 }
    seed:
      items:
        - { id: 1, sku: "ABC-1", stock: 1 }
    invariant:
      # Conservation, not non_negative. The handler decrements through an ORM
      # attribute, so two concurrent requests both write stock = 0 rather than
      # one writing -1: a `stock >= 0` check would hold while two units were
      # sold from a stock of one. Comparing the stock left against the orders
      # recorded is what actually detects the oversell.
      kind: conservation
      table: items
      column: stock
      check_sql: |
        SELECT i.id, i.stock, o.sold, i.stock + o.sold AS total
        FROM items i
        CROSS JOIN (SELECT COALESCE(SUM(qty), 0) AS sold FROM orders) o
        WHERE i.id = 1 AND i.stock + o.sold <> 1
    concurrency: 2
    trials: 30

  # conservation -- two accounts, one transfer amount equal to the entire
  # sender balance, so a lost update either overdraws the sender or double
  # credits the receiver and the pair's total stops summing to 50.
  - id: transfer
    route: "POST /wallet/transfer"
    handler: "shop/routes/wallet.py::transfer"
    spec: "a transfer must never change the total balance held across the two accounts"
    payload: { from_id: 1, to_id: 2, amount: 50 }
    seed:
      accounts:
        - { id: 1, owner: "alice", balance: 50 }
        - { id: 2, owner: "bob", balance: 0 }
    invariant:
      kind: conservation
      table: accounts
      column: balance
      key_columns: ["id"]
      expected_total: 50
    concurrency: 2
    trials: 30

  # single_use -- a coupon with a redemption budget of exactly one, redeemed
  # by two concurrent requests. At most one coupon_redemptions row for this
  # coupon_id should ever exist.
  - id: coupon_redeem
    route: "POST /coupons/redeem"
    handler: "shop/routes/coupons.py::redeem_coupon"
    spec: "a coupon must never be redeemed more times than its max_redemptions"
    payload: { code: "SAVE10", redeemed_by: "shopper@example.com" }
    seed:
      coupons:
        - { id: 1, code: "SAVE10", max_redemptions: 1 }
    invariant:
      kind: single_use
      table: coupon_redemptions
      key_columns: ["coupon_id"]
      limit: 1
    concurrency: 2
    trials: 30

  # duplicate_insert -- no existing user, two concurrent signups with the
  # identical email. Without a unique index, both can find nothing and
  # both insert.
  - id: signup
    route: "POST /signup"
    handler: "shop/routes/signup.py::signup"
    spec: "a user account must be created at most once per email address"
    payload: { email: "duplicate@example.com" }
    invariant:
      kind: duplicate_insert
      table: users
      key_columns: ["email"]
    concurrency: 2
    trials: 30

  # aggregate_limit -- a team at max_members - 1, so there is exactly one
  # open seat, joined by two concurrent requests. At most one should succeed.
  - id: team_join
    route: "POST /teams/1/members"
    handler: "shop/routes/teams.py::add_team_member"
    spec: "a team must never have more members than its max_members limit"
    payload: { user_email: "newcomer@example.com" }
    seed:
      teams:
        - { id: 1, name: "Alpha", max_members: 5 }
      team_members:
        - { id: 1, team_id: 1, user_email: "a@example.com" }
        - { id: 2, team_id: 1, user_email: "b@example.com" }
        - { id: 3, team_id: 1, user_email: "c@example.com" }
        - { id: 4, team_id: 1, user_email: "d@example.com" }
    invariant:
      kind: aggregate_limit
      table: team_members
      key_columns: ["team_id"]
      limit: 5
    concurrency: 2
    trials: 30
