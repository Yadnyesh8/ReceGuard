[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# The real value comes from the DATABASE_URL environment variable at runtime
# (see migrations/env.py); this is only a placeholder so `alembic` commands
# do not fail when the env var is unset (e.g. `alembic history`).
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/shop

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
