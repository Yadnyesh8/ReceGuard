[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raceguard-shop"
version = "0.1.0"
description = "Deliberately-vulnerable reference app for RaceGuard's demo, integration tests, and docs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["shop"]
